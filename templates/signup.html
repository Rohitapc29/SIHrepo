{% extends 'base.html' %}
{% block title %}Signup{% endblock %}
{% block content %}
<h2>Signup</h2>
<form method="post">
  <label>Username <input type="text" name="username" required></label>
  <label>Password <input type="password" name="password" required></label>
  <button type="submit">Create Account</button>
</form>
{% endblock %}
